spring:
  datasource:
    url: jdbc:h2:mem:${random.uuid};MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.xml

app:
  short-url:
    base-url: http://sho.rt/r/
  security:
    jwt:
      # Random per test run, so no signing key is ever committed.
      secret: ${random.value}${random.value}
      ttl: 15m
