spring:
  datasource:
    url: jdbc:h2:mem:testdb-${random.uuid};MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  data:
    web:
      pageable:
        max-page-size: 100
  cache:
    type: caffeine
    cache-names: products
    caffeine:
      spec: maximumSize=1000,expireAfterWrite=10m,recordStats
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.xml
